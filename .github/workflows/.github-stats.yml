name: Update GitHub Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=shivani-scm&
            show_icons=true&
            theme=github_dark&
            bg_color=0D1117&
            border_color=58A6FF&
            icon_color=58A6FF&
            title_color=58A6FF&
            text_color=C9D1D9&
            hide_border=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub Streak
        run: |
          curl -L \
            "https://streak-stats.demolab.com/?user=shivani-scm&theme=github-dark-blue&background=0D1117&border=58A6FF&stroke=58A6FF&ring=58A6FF&fire=FF6B35&currStreakLabel=58A6FF&sideLabels=C9D1D9&dates=C9D1D9&currStreakNum=FFFFFF&sideNums=FFFFFF" \
            -o profile/streak.svg

      - name: Generate GitHub Trophies
        run: |
          curl -L \
            "https://github-profile-trophy.vercel.app/?username=shivani-scm&theme=darkhub&no-bg=true&no-frame=true&column=7&margin-w=10&margin-h=10" \
            -o profile/trophy.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub profile cards"
            git push
          fi
